name: Generate contribution flow

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution flow
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/wolfgang-flow.svg?palette=github-light&color_snake=#F04A24&color_dots=#EBEDF0,#D9D9D4,#B8B8B2,#72726D,#242424
            dist/wolfgang-flow-dark.svg?palette=github-dark&color_snake=#FF5A36&color_dots=#161B22,#2D3238,#4D535A,#858B91,#D6D7D2

      - name: Publish generated SVG files
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
