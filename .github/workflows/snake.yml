name: Generate contribution flow

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution flow
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/wolfgang-flow.svg?palette=github-light&color_snake=#5E7BFF&color_dots=#EBEDF0,#DCE5FF,#B8C8FF,#8EA5FF,#5E7BFF
            dist/wolfgang-flow-dark.svg?palette=github-dark&color_snake=#8B5CF6&color_dots=#161B22,#26335A,#384E88,#4F6FD0,#5E7BFF

      - name: Publish generated SVG files
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
