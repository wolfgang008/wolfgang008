<svg width="1100" height="230" viewBox="0 0 1100 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>WOLFGANG — sketch to solid</title>
  <defs>
    <clipPath id="build-clip-dark">
      <rect class="build-reveal" x="68" y="44" width="964" height="146"/>
    </clipPath>
    <style>
      .build-reveal { transform-box: fill-box; transform-origin: left center; animation: reveal 9s cubic-bezier(.65,0,.35,1) infinite; }
      .word-outline { animation: outline 9s ease-in-out infinite, drift 9s linear infinite; }
      .word-solid { animation: solid 9s ease-in-out infinite; }
      .scan-line { transform-origin: center; animation: scan 9s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes reveal {
        0%, 12% { transform: scaleX(0); }
        40%, 90% { transform: scaleX(1); }
        91%, 100% { transform: scaleX(0); }
      }
      @keyframes outline {
        0%, 14%, 96%, 100% { opacity: .82; }
        42%, 88% { opacity: .16; }
      }
      @keyframes drift {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -22; }
      }
      @keyframes solid {
        0%, 12%, 98%, 100% { opacity: 0; }
        18%, 88% { opacity: 1; }
      }
      @keyframes scan {
        0%, 11% { opacity: 0; transform: translateX(0) scaleY(.72); }
        14% { opacity: .9; transform: translateX(0) scaleY(1); }
        39% { opacity: .9; transform: translateX(964px) scaleY(1); }
        42%, 100% { opacity: 0; transform: translateX(964px) scaleY(.72); }
      }
      @media (prefers-reduced-motion: reduce) {
        .build-reveal { animation: none; transform: scaleX(1); }
        .word-outline { animation: none; opacity: .12; }
        .word-solid { animation: none; opacity: 1; }
        .scan-line { display: none; }
      }
    </style>
  </defs>

  <text class="word-outline" x="550" y="158" fill="none" stroke="#555A60" stroke-width="1.25" stroke-dasharray="7 4" font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif" font-size="126" font-weight="820" letter-spacing="10" text-anchor="middle">WOLFGANG</text>
  <text class="word-solid" x="550" y="158" fill="#F0EFEA" clip-path="url(#build-clip-dark)" font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif" font-size="126" font-weight="820" letter-spacing="10" text-anchor="middle">WOLFGANG</text>
  <line class="scan-line" x1="68" y1="52" x2="68" y2="178" stroke="#FF5A36" stroke-width="2"/>
</svg>
